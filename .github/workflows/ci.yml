name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
      SUPABASE_SERVICE_ROLE_KEY: placeholder
      GROW_API_URL: https://placeholder.meshulam.co.il

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # onnxruntime-node (via @huggingface/transformers) downloads CUDA binaries
      # on Linux x64 during install; the v1.21.0 GPU asset now returns 404 and
      # nothing here runs on a GPU.
      - run: npm ci
        env:
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:run

      - name: Audit
        run: npm audit --omit=dev --audit-level=critical

      - name: Build
        run: npm run build
